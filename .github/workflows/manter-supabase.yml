# Mantém o projeto Supabase ativo: o plano grátis pausa após 7 dias sem uso.
# Uma consulta de leitura por dia (lote aberto agora, informação pública).
name: Manter Supabase ativo
on:
  schedule:
    - cron: '23 11 * * *'   # todo dia às 08h23 de Brasília
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta o lote atual
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://havplwmjqiiivqhnxsxv.supabase.co/rest/v1/rpc/varal_lote_atual" \
            -H "apikey: sb_publishable_iyfx-VsBMAVWdeXyMTH8OA_3KPf252v" \
            -H "Authorization: Bearer sb_publishable_iyfx-VsBMAVWdeXyMTH8OA_3KPf252v" \
            -H "Content-Type: application/json" -d '{}')
          echo "Supabase respondeu $code"
          test "$code" = "200"
