<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel · Pronta pra Contar</title>
<link rel="icon" href="assets/logo-pronta.png">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1f2a44;--paper:#f5eedf;--white:#fffdf8;--blue:#26408f;--teal:#2f86b5;--coral:#ff6b6b;--yellow:#f7c948;--green:#3aa655;--muted:#5d6478;--line:rgba(31,42,68,.14);
    --display:'Fredoka',system-ui,sans-serif;--body:'Nunito',system-ui,sans-serif}
  *{box-sizing:border-box;min-width:0}
  [hidden]{display:none!important}
  body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--body)}
  h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1}
  button,input,select{font:inherit;color:inherit}
  .wrap{width:min(1180px,calc(100% - 32px));margin:auto}
  header{background:var(--blue);color:#fff}
  header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:68px;flex-wrap:wrap;padding:8px 0}
  header img{height:44px;background:#fff;border-radius:10px;padding:4px}
  header h1{font-size:20px;display:flex;align-items:center;gap:12px}
  #user-box{display:flex;gap:8px;align-items:center;font-size:14px;flex-wrap:wrap}
  .btn{border:0;border-radius:999px;background:var(--coral);color:#fff;padding:10px 18px;font:600 15px var(--display);cursor:pointer;min-height:44px}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.sm{padding:6px 12px;min-height:36px;font-size:14px}
  .btn.ghost{background:transparent;color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue)}
  header .btn.ghost{color:#fff;box-shadow:inset 0 0 0 2px #fff}
  .btn.green{background:var(--green)}.btn.teal{background:var(--teal)}.btn.gray{background:#8a90a2}
  .card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 2px 0 var(--line)}
  #login{max-width:420px;margin:48px auto}
  #login h2{font-size:28px;margin-bottom:6px}
  label{display:block;font-weight:800;font-size:14px;margin-top:14px}
  input,select{width:100%;border:2px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--white);margin-top:6px;font-size:16px}
  input:focus,select:focus{outline:none;border-color:var(--teal)}
  .msg{color:#c23b3b;font-weight:700;font-size:14px;min-height:20px;margin-top:10px}
  .msg.ok{color:var(--green)}
  .link{background:none;border:0;color:var(--blue);font-weight:800;cursor:pointer;padding:8px 0;text-decoration:underline}
  main{padding:24px 0 60px}
  .kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:18px}
  .kpi{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 2px 0 var(--line)}
  .kpi b{display:block;font:700 30px/1 var(--display);color:var(--blue)}
  .kpi small{font-weight:700;color:var(--muted);font-size:13px}
  .kpi.money b{color:var(--green)}
  .kpi.pix b{color:#b7791f}
  .alerta-pix{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#fff3cd;border:2px solid var(--yellow);border-radius:18px;padding:14px 18px;margin-bottom:16px}
  .alerta-pix h3{font-size:19px}.alerta-pix p{margin:2px 0 0;font-size:15px}
  .alerta-pix.novo{animation:chama 1s ease 3}
  @keyframes chama{50%{box-shadow:0 0 0 6px rgba(247,201,72,.6)}}
  .st-pix{background:#fff3cd;color:#8a6100;box-shadow:0 0 0 2px var(--yellow) inset}
  tr.pix-row{background:#fffbea}
  .som{display:flex;gap:8px;align-items:center;font-size:13px;opacity:.9}
  .alerta-nova{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#e6f0fb;border:2px solid var(--teal);border-radius:18px;padding:14px 18px;margin-bottom:12px}
  .alerta-nova h3{font-size:19px}.alerta-nova p{margin:2px 0 0;font-size:15px}
  .alerta-nova.novo{animation:chama2 1s ease 3}
  @keyframes chama2{50%{box-shadow:0 0 0 6px rgba(47,134,181,.45)}}
  .tag.nova{background:var(--teal);color:#fff;margin-left:4px}
  tr.nova-row{background:#f1f7fd}
  dialog.ficha{max-width:640px;width:calc(100% - 24px);padding:0;border-radius:22px}
  .ficha header{background:var(--blue);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .ficha header h3{font-size:21px;color:#fff}
  .ficha header small{display:block;color:#c9d3f5;font-size:13px}
  .ficha .corpo{padding:16px 20px;max-height:62vh;overflow:auto}
  .ficha .grade{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 14px}
  .ficha .grade .full{grid-column:1/-1}
  .ficha label{margin-top:0}
  .ficha .info{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 14px;background:#f6f1e6;border-radius:14px;padding:12px 14px;margin-top:14px;font-size:14px}
  .ficha .info span{color:var(--muted);display:block;font-size:12px;font-weight:800;text-transform:uppercase}
  .ficha footer{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line)}
  .ficha .x{background:none;border:0;color:#fff;font-size:24px;cursor:pointer;min-width:44px;min-height:44px}
  @media(max-width:600px){ .ficha .grade,.ficha .info{grid-template-columns:minmax(0,1fr)} }
  .tools{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
  .tools > *{flex:1 1 180px}
  .tools .chk{flex:0 0 auto;display:flex;gap:8px;align-items:center;font-weight:800;font-size:14px;margin:0 0 12px}
  .tools .chk input{width:20px;height:20px;margin:0}
  .tools .btn{flex:0 0 auto}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden;font-size:14px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{background:#ece1cb;font-weight:800;font-size:13px}
  td small{color:var(--muted);display:block}
  td a{white-space:nowrap}
  .tag{display:inline-block;border-radius:999px;padding:3px 10px;font:800 12px var(--body);white-space:nowrap}
  .st-pendente{background:#fff3cd;color:#8a6100}.st-confirmado{background:#dff3e3;color:#1e6b33}.st-cancelado{background:#f2dede;color:#8a2c2c}
  .tag.teste{background:var(--yellow);color:var(--ink);margin-left:4px}
  .acoes{display:flex;gap:6px;flex-wrap:wrap}
  .marcos{font-size:12px;color:var(--muted);margin-top:4px}
  .vazio{text-align:center;color:var(--muted);padding:40px 12px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;transition:transform .3s;z-index:9}
  .toast.show{transform:translate(-50%,0)}
  dialog{border:0;border-radius:20px;padding:24px;max-width:420px;width:calc(100% - 32px)}
  dialog::backdrop{background:rgba(15,20,35,.55)}
  @media(max-width:860px){
    .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
    thead{display:none}
    table,tbody,tr,td{display:block}
    tr{border-bottom:2px solid var(--line);padding:8px 0}
    td{border:0;padding:4px 14px}
    td::before{content:attr(data-l);display:block;font-weight:800;font-size:11px;color:var(--muted);text-transform:uppercase}
  }
</style>
</head>
<body>
<header><div class="wrap">
  <h1><img src="assets/logo-pronta-titulo.png" alt="">Painel de inscrições</h1>
  <div id="user-box" hidden><span id="user-email"></span><button class="btn ghost sm" id="btn-senha" type="button">Trocar senha</button><button class="btn ghost sm" id="btn-sair" type="button">Sair</button></div>
</div></header>

<section id="login" class="card" hidden>
  <h2 id="l-titulo">Entrar</h2>
  <p style="margin:0;color:var(--muted)" id="l-sub">Acesso só para a equipe do Varal de Histórias.</p>
  <form id="f-login">
    <label>E-mail<input id="l-email" type="email" autocomplete="email" required></label>
    <label>Senha<input id="l-senha" type="password" autocomplete="current-password" minlength="8" required></label>
    <div class="msg" id="l-msg" role="alert"></div>
    <button class="btn" style="width:100%;margin-top:8px" id="l-btn">Entrar</button>
  </form>
  <button class="link" type="button" id="l-modo">Primeiro acesso? Criar minha senha</button><br>
  <button class="link" type="button" id="l-esqueci">Esqueci minha senha</button>
</section>

<main id="app" hidden><div class="wrap">
  <div class="alerta-nova" id="alerta-nova" hidden role="alert"><div><h3 id="an-titulo">Nova inscrição</h3><p id="an-txt"></p></div><button class="btn teal" type="button" id="an-ver">Conferir dados</button></div>
  <div class="alerta-pix" id="alerta-pix" hidden role="alert"><div><h3 id="ap-titulo">Pix para conferir</h3><p id="ap-txt"></p></div><button class="btn green" type="button" id="ap-ver">Ver quem pagou</button></div>
  <div class="kpis" id="kpis"></div>
  <div class="tools">
    <label style="margin:0">Buscar<input id="busca" type="search" placeholder="Nome, CPF, e-mail, cidade ou WhatsApp"></label>
    <label style="margin:0">Status<select id="f-status"><option value="">Todos</option><option>pendente</option><option>confirmado</option><option>cancelado</option></select></label>
    <label class="chk"><input type="checkbox" id="f-teste" checked>Mostrar testes</label>
    <button class="btn teal" type="button" id="btn-atualizar">Atualizar</button>
    <button class="btn" type="button" id="btn-excel">Baixar Excel</button>
  </div>
  <table>
    <thead><tr><th>Data</th><th>Inscrita(o)</th><th>Contato</th><th>Perfil</th><th>Valor</th><th>Status</th><th>Ações</th></tr></thead>
    <tbody id="lista"></tbody>
  </table>
</div></main>

<dialog class="ficha" id="d-ficha" aria-labelledby="fi-nome">
  <header><div><h3 id="fi-nome">Ficha da inscrição</h3><small id="fi-sub"></small></div><button class="x" type="button" id="fi-fechar" aria-label="Fechar">×</button></header>
  <form id="f-ficha" class="corpo" novalidate>
    <div class="grade">
      <label class="full">Nome completo (como sai no certificado)<input id="fi-n" maxlength="120" required></label>
      <label>CPF<input id="fi-cpf" inputmode="numeric" maxlength="14"></label>
      <label>WhatsApp<input id="fi-t" maxlength="20" required></label>
      <label class="full">E-mail<input id="fi-e" type="email" maxlength="160" required></label>
      <label class="full">Cidade e estado<input id="fi-c" maxlength="80" required></label>
      <label>Perfil<select id="fi-p"></select></label>
      <label>Já conta histórias?<select id="fi-v"><option>Ainda não, quero começar</option><option>Às vezes, quero melhorar</option><option>Sempre, quero me profissionalizar</option></select></label>
      <label class="full">Observação<input id="fi-o" maxlength="500"></label>
    </div>
    <div class="info" id="fi-info"></div>
    <div class="msg" id="fi-msg" role="alert"></div>
  </form>
  <footer>
    <button class="btn ghost" type="button" id="fi-salvar">Salvar correções</button>
    <button class="btn gray" type="button" id="fi-cancelar">Cancelar inscrição</button>
    <button class="btn green" type="button" id="fi-aprovar">Aprovar (pagamento confirmado)</button>
  </footer>
</dialog>
<dialog id="d-senha"><form method="dialog" id="f-senha">
  <h3 style="margin-bottom:6px">Trocar senha</h3>
  <label>Nova senha (mínimo 8 caracteres)<input id="nova-senha" type="password" minlength="8" autocomplete="new-password"></label>
  <div class="msg" id="s-msg"></div>
  <div class="acoes" style="margin-top:12px"><button class="btn" value="ok">Salvar</button><button class="btn ghost" value="cancel" formnovalidate>Cancelar</button></div>
</form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
{
const SUPABASE = { url: 'https://havplwmjqiiivqhnxsxv.supabase.co', key: 'sb_publishable_iyfx-VsBMAVWdeXyMTH8OA_3KPf252v' };
const db = supabase.createClient(SUPABASE.url, SUPABASE.key);
const PAINEL_URL = location.origin + location.pathname; // links dos e-mails voltam para cá
const $ = (s, el=document) => el.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v => 'R$ ' + Number(v||0).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
const dataBR = s => s ? new Date(s).toLocaleString('pt-BR', { timeZone:'America/Sao_Paulo', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }) : '';
const soDigitos = s => String(s||'').replace(/\D/g,'');
const fmtCpf = c => c ? String(c).replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4') : 'sem CPF';
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),3000); }

let linhas = [], criando = false, recuperando = false;

/* ---------- login ---------- */
function mostrarLogin(msg=''){ $('#login').hidden=false; $('#app').hidden=true; $('#user-box').hidden=true; $('#l-msg').textContent=msg; }
async function iniciar(){
  // volta de um link do e-mail: mostra erro amigável ou abre a troca de senha
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('error_code') || h.get('error')) {
    history.replaceState(null, '', PAINEL_URL);
    const expirado = /otp_expired|expired|invalid/i.test(h.get('error_code')+' '+h.get('error_description'));
    mostrarLogin(expirado ? 'Esse link do e-mail já foi usado ou expirou. Se você já confirmou o cadastro, é só entrar com e-mail e senha.' : 'Não foi possível abrir o link do e-mail. Tente entrar com e-mail e senha.');
    return;
  }
  if (h.get('type') === 'recovery') recuperando = true;
  const { data:{ session } } = await db.auth.getSession();
  if(!session) return mostrarLogin();
  const { data: ok, error } = await db.rpc('varal_is_organizador');
  if(error || !ok){ await db.auth.signOut(); return mostrarLogin('Este e-mail ainda não tem acesso ao painel. Peça a liberação ao Romero.'); }
  $('#login').hidden=true; $('#app').hidden=false; $('#user-box').hidden=false; $('#user-email').textContent=session.user.email;
  if (location.hash) history.replaceState(null, '', PAINEL_URL);
  if (recuperando) { recuperando=false; $('#nova-senha').value=''; $('#d-senha').showModal(); toast('Crie sua nova senha'); }
  await carregar();
  tempoReal();
}
$('#l-modo').addEventListener('click', ()=>{
  criando = !criando;
  $('#l-titulo').textContent = criando ? 'Criar minha senha' : 'Entrar';
  $('#l-sub').textContent = criando ? 'Use o e-mail liberado pela equipe e escolha uma senha (mínimo 8 caracteres).' : 'Acesso só para a equipe do Varal de Histórias.';
  $('#l-btn').textContent = criando ? 'Criar senha' : 'Entrar';
  $('#l-modo').textContent = criando ? 'Já tenho senha. Entrar' : 'Primeiro acesso? Criar minha senha';
  $('#l-senha').autocomplete = criando ? 'new-password' : 'current-password';
  $('#l-msg').textContent=''; $('#l-msg').className='msg';
});
$('#f-login').addEventListener('submit', async e=>{
  e.preventDefault(); try { audio = audio || new (window.AudioContext||window.webkitAudioContext)(); } catch(_) {} const m=$('#l-msg'); m.className='msg'; m.textContent='';
  const email=$('#l-email').value.trim().toLowerCase(), password=$('#l-senha').value;
  $('#l-btn').disabled=true;
  if(criando){
    const { data, error } = await db.auth.signUp({ email, password, options:{ emailRedirectTo: PAINEL_URL } });
    $('#l-btn').disabled=false;
    if(error){ m.textContent = /already|registered/i.test(error.message) ? 'Esse e-mail já tem senha. Clique em "Já tenho senha. Entrar".' : 'Não foi possível criar: '+error.message; return; }
    if(!data.session){ m.className='msg ok'; m.textContent='Pronto! Confirme no link que chegou no seu e-mail e depois volte aqui para entrar.'; return; }
    return iniciar();
  }
  const { error } = await db.auth.signInWithPassword({ email, password });
  $('#l-btn').disabled=false;
  if(error){ m.textContent = (error.code==='email_not_confirmed' || /confirm/i.test(error.message)) ? 'Falta confirmar o e-mail: abra o link que chegou na sua caixa de entrada.' : 'E-mail ou senha incorretos. Se não lembra a senha, toque em "Esqueci minha senha".'; return; }
  iniciar();
});
$('#l-esqueci').addEventListener('click', async ()=>{
  const m=$('#l-msg'); m.className='msg'; const email=$('#l-email').value.trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ m.textContent='Digite seu e-mail no campo acima e toque de novo em "Esqueci minha senha".'; $('#l-email').focus(); return; }
  const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo: PAINEL_URL });
  if(error){ m.textContent = /rate|seconds/i.test(error.message) ? 'Aguarde um minuto antes de pedir outro e-mail.' : 'Não foi possível enviar: '+error.message; return; }
  m.className='msg ok'; m.textContent='Enviamos um link para '+email+'. Abra o e-mail e toque no link para criar uma nova senha.';
});
$('#btn-sair').addEventListener('click', async()=>{ await db.auth.signOut(); location.reload(); });
$('#btn-senha').addEventListener('click', ()=>{ $('#nova-senha').value=''; $('#s-msg').textContent=''; $('#d-senha').showModal(); });
$('#d-senha').addEventListener('close', async()=>{
  if($('#d-senha').returnValue!=='ok') return;
  const nova=$('#nova-senha').value;
  if(nova.length<8){ toast('A senha precisa ter pelo menos 8 caracteres.'); return; }
  const { error } = await db.auth.updateUser({ password:nova });
  toast(error ? 'Não foi possível trocar a senha.' : 'Senha trocada ✓');
});

/* ---------- dados ---------- */
const pixParaConferir = r => r.status==='pendente' && !!r.pagamento_informado_em;
let jaAvisados = null, audio = null, canal = null, idsConhecidos = null;
const VISTAS_KEY = 'varal-painel-vistas';
let vistas = new Set(); try { vistas = new Set(JSON.parse(localStorage.getItem(VISTAS_KEY)||'[]')); } catch(e) {}
const marcarVista = id => { vistas.add(id); try { localStorage.setItem(VISTAS_KEY, JSON.stringify([...vistas].slice(-2000))); } catch(e) {} };
const ehNova = r => r.status==='pendente' && !vistas.has(r.id);
function bip(){ try { audio = audio || new (window.AudioContext||window.webkitAudioContext)(); [0,.18,.36].forEach((t,i)=>{ const o=audio.createOscillator(), g=audio.createGain(); o.frequency.value=[784,1046,1318][i]; g.gain.setValueAtTime(.18,audio.currentTime+t); g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+t+.3); o.connect(g).connect(audio.destination); o.start(audio.currentTime+t); o.stop(audio.currentTime+t+.32); }); } catch(e) {} }
async function carregar(){
  const { data, error } = await db.from('varal_inscricoes').select('*').order('created_at', { ascending:false });
  if(error){ toast('Erro ao carregar: '+error.message); return; }
  linhas = data;
  const agora = new Set(linhas.filter(pixParaConferir).map(r=>r.id));
  if (jaAvisados) {
    const novos = linhas.filter(r => agora.has(r.id) && !jaAvisados.has(r.id));
    if (novos.length) {
      bip(); toast(`Novo Pix para conferir: ${novos.map(r=>r.nome).join(', ')}`);
      $('#alerta-pix').classList.remove('novo'); void $('#alerta-pix').offsetWidth; $('#alerta-pix').classList.add('novo');
      try { if (document.hidden) document.title = '(!) Pix para conferir · Painel'; } catch(e) {}
    }
  }
  jaAvisados = agora;
  // nova inscrição (no ato): avisa com som e destaca até o Olavo abrir a ficha
  const ids = new Set(linhas.map(r=>r.id));
  if (idsConhecidos) {
    const chegaram = linhas.filter(r => !idsConhecidos.has(r.id));
    if (chegaram.length) {
      bip(); toast(`Nova inscrição: ${chegaram.map(r=>r.nome).join(', ')}`);
      $('#alerta-nova').classList.remove('novo'); void $('#alerta-nova').offsetWidth; $('#alerta-nova').classList.add('novo');
      try { if (document.hidden) document.title = '(!) Nova inscrição · Painel'; } catch(e) {}
    }
  } else if (!localStorage.getItem(VISTAS_KEY)) { linhas.forEach(r=>marcarVista(r.id)); } // primeiro uso: o que já existe conta como visto
  idsConhecidos = ids;
  render();
  if (fichaId && $('#d-ficha').open) preencherInfo(linhas.find(r=>r.id===fichaId));
}
function tempoReal(){
  if (canal) return;
  canal = db.channel('varal-inscricoes')
    .on('postgres_changes', { event:'*', schema:'public', table:'varal_inscricoes' }, ()=>carregar())
    .subscribe();
  setInterval(carregar, 30000); // reserva, caso o tempo real caia
}
document.addEventListener('click', ()=>{ try { audio = audio || new (window.AudioContext||window.webkitAudioContext)(); audio.resume(); } catch(e) {} }, { once:false, passive:true });
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ document.title='Painel · Pronta pra Contar'; carregar(); } });
function filtradas(){
  const q=$('#busca').value.trim().toLowerCase(), qd=soDigitos(q), st=$('#f-status').value, testes=$('#f-teste').checked;
  return linhas.filter(r => (testes || !r.teste) && (!st || r.status===st) &&
    (!q || [r.nome,r.email,r.cidade,r.telefone].some(x=>String(x||'').toLowerCase().includes(q))
        || (qd.length>=3 && [soDigitos(r.cpf),soDigitos(r.telefone)].some(x=>x.includes(qd)))));
}
function render(){
  const base = linhas.filter(r => $('#f-teste').checked || !r.teste);
  const conta = s => base.filter(r=>r.status===s).length;
  const arrecadado = base.filter(r=>r.status==='confirmado').reduce((t,r)=>t+Number(r.valor||0),0);
  const aConferir = base.filter(pixParaConferir);
  $('#alerta-pix').hidden = !aConferir.length;
  if (aConferir.length) {
    $('#ap-titulo').textContent = aConferir.length===1 ? 'Novo Pix para conferir' : `${aConferir.length} Pix para conferir`;
    $('#ap-txt').textContent = aConferir.map(r=>`${r.nome} (${brl(r.valor)})`).join(', ') + ' avisou que pagou. Confira no extrato e confirme.';
  }
  const novas = base.filter(ehNova);
  $('#alerta-nova').hidden = !novas.length;
  if (novas.length) {
    $('#an-titulo').textContent = novas.length===1 ? 'Nova inscrição para conferir' : `${novas.length} novas inscrições para conferir`;
    $('#an-txt').textContent = novas.map(r=>r.nome).join(', ') + '. Abra a ficha, confira os dados e aprove quando o pagamento cair.';
  }
  $('#kpis').innerHTML = [
    [base.length,'inscrições'],[aConferir.length,'Pix para conferir','pix'],[conta('pendente')-aConferir.length,'aguardando pagamento'],[conta('confirmado'),'confirmadas'],[conta('cancelado'),'canceladas'],[brl(arrecadado),'confirmado em R$','money'],
  ].map(([n,t,c])=>`<div class="kpi ${c||''}"><b>${esc(n)}</b><small>${esc(t)}</small></div>`).join('');
  const rows = filtradas().sort((a,b)=>pixParaConferir(b)-pixParaConferir(a));
  $('#lista').innerHTML = rows.length ? rows.map(r=>{
    const wa = 'https://wa.me/55'+soDigitos(r.telefone).replace(/^55(?=\d{10,11}$)/,'');
    const marcos = [r.pagamento_confirmado_em&&'pago '+dataBR(r.pagamento_confirmado_em), r.link_enviado_em&&'link '+dataBR(r.link_enviado_em), r.certificado_emitido_em&&'certificado '+dataBR(r.certificado_emitido_em)].filter(Boolean).join(' · ');
    const acoes = r.status==='pendente'
      ? `<button class="btn green sm" data-a="confirmar" data-id="${esc(r.id)}">Confirmar pagamento</button><button class="btn gray sm" data-a="cancelar" data-id="${esc(r.id)}">Cancelar</button>`
      : r.status==='confirmado'
      ? `${r.link_enviado_em?'':`<button class="btn teal sm" data-a="link" data-id="${esc(r.id)}">Link enviado</button>`}${r.certificado_emitido_em?'':`<button class="btn teal sm" data-a="certificado" data-id="${esc(r.id)}">Certificado emitido</button>`}<button class="btn ghost sm" data-a="pendente" data-id="${esc(r.id)}">Voltar p/ pendente</button>`
      : `<button class="btn ghost sm" data-a="pendente" data-id="${esc(r.id)}">Reabrir</button>`;
    const pix = pixParaConferir(r), nova = ehNova(r);
    return `<tr class="${pix?'pix-row':(nova?'nova-row':'')}">
      <td data-l="Data">${esc(dataBR(r.created_at))}</td>
      <td data-l="Inscrita(o)"><b>${esc(r.nome)}</b>${nova?'<span class="tag nova">NOVA</span>':''}${r.teste?'<span class="tag teste">TESTE</span>':''}<small>${esc(r.cidade)} · CPF ${esc(fmtCpf(r.cpf))}</small>${r.obs?`<small>“${esc(r.obs)}”</small>`:''}</td>
      <td data-l="Contato"><a href="${esc(wa)}" target="_blank" rel="noopener">${esc(r.telefone)}</a><small>${esc(r.email)}</small></td>
      <td data-l="Perfil">${esc(r.perfil)}<small>${esc(r.nivel)}</small></td>
      <td data-l="Valor">${esc(brl(r.valor))}<small>${esc(r.lote)}</small></td>
      <td data-l="Status">${pix?`<span class="tag st-pix">Pix para conferir</span><div class="marcos">avisou ${esc(dataBR(r.pagamento_informado_em))}</div>`:`<span class="tag st-${esc(r.status)}">${esc(r.status)}</span>`}${marcos?`<div class="marcos">${esc(marcos)}</div>`:''}${r.comprovante?`<button class="btn ghost sm" style="margin-top:6px" data-comp="${esc(r.comprovante)}">📎 Ver comprovante</button>`:''}</td>
      <td data-l="Ações"><div class="acoes"><button class="btn ${nova?'teal':'ghost'} sm" data-ficha="${esc(r.id)}">Ver ficha</button>${acoes}</div></td></tr>`;
  }).join('') : `<tr><td colspan="7" class="vazio">${linhas.length?'Nenhuma inscrição com esse filtro.':'Ainda não há inscrições.'}</td></tr>`;
}
const ACOES = {
  confirmar:   () => ({ status:'confirmado', pagamento_confirmado_em: new Date().toISOString() }),
  cancelar:    () => ({ status:'cancelado' }),
  pendente:    () => ({ status:'pendente', pagamento_confirmado_em:null }),
  link:        () => ({ link_enviado_em: new Date().toISOString() }),
  certificado: () => ({ certificado_emitido_em: new Date().toISOString() }),
};
$('#lista').addEventListener('click', async e=>{
  const c=e.target.closest('[data-comp]');
  if(c){
    const janela = window.open('', '_blank');
    const { data, error } = await db.storage.from('varal-comprovantes').createSignedUrl(c.dataset.comp, 300);
    if(error || !data?.signedUrl){ if(janela) janela.close(); toast('Não foi possível abrir o comprovante.'); return; }
    if(janela) janela.location = data.signedUrl; else location.href = data.signedUrl;
    return;
  }
  const fb=e.target.closest('[data-ficha]'); if(fb){ abrirFicha(fb.dataset.ficha); return; }
  const b=e.target.closest('[data-a]'); if(!b) return;
  b.disabled=true;
  const { error } = await db.from('varal_inscricoes').update(ACOES[b.dataset.a]()).eq('id', b.dataset.id);
  if(error){ b.disabled=false; toast(error.code==='23505' ? 'Já existe outra inscrição ativa com este e-mail.' : 'Não foi possível salvar: '+error.message); return; }
  toast('Salvo ✓'); carregar();
});
['input','change'].forEach(ev=>{ $('#busca').addEventListener(ev,render); $('#f-status').addEventListener(ev,render); $('#f-teste').addEventListener(ev,render); });
$('#btn-atualizar').addEventListener('click', carregar);

/* ---------- ficha: todos os dados coletados na inscrição, para conferir, corrigir e aprovar ---------- */
const PERFIS = ['Professora / professor de Educação Infantil','Professora / professor de Ensino Fundamental','Contadora / contador de histórias','Bibliotecária(o) ou mediador(a) de leitura','Outro educador','Mãe, pai ou familiar','Outro'];
let fichaId = null;
function cpfOk(c){ c=soDigitos(c); if(c.length!==11 || /^(\d)\1{10}$/.test(c)) return false;
  const dv = n => { let t=0; for(let i=0;i<n;i++) t+=+c[i]*(n+1-i); const r=(t*10)%11; return r===10?0:r; };
  return dv(9)===+c[9] && dv(10)===+c[10]; }
document.addEventListener('input', e=>{ if (e.target.id==='fi-cpf') { let v=soDigitos(e.target.value).slice(0,11); e.target.value = v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})\.(\d{3})(\d)/,'$1.$2.$3').replace(/(\d{3})\.(\d{3})\.(\d{3})(\d{1,2})$/,'$1.$2.$3-$4'); } });
function preencherInfo(r){
  if(!r) return;
  const st = pixParaConferir(r) ? 'Pix para conferir' : r.status;
  const itens = [
    ['Inscrita em', dataBR(r.created_at)],
    ['Lote e valor', `${r.lote||'—'} · ${brl(r.valor)}`], ['Status', st],
    ['Aceite de contato', r.aceite ? 'sim' : 'não'], ['Avisou que pagou', r.pagamento_informado_em ? dataBR(r.pagamento_informado_em) : 'ainda não'],
    ['Pagamento confirmado', r.pagamento_confirmado_em ? dataBR(r.pagamento_confirmado_em) : '—'], ['Teste', r.teste ? 'sim (prévia)' : 'não'],
  ];
  $('#fi-info').innerHTML = itens.map(([k,v])=>`<div><span>${esc(k)}</span>${esc(v)}</div>`).join('')
    + (r.comprovante ? `<div class="full" style="grid-column:1/-1"><button class="btn ghost sm" type="button" data-comp-ficha="${esc(r.comprovante)}">📎 Ver comprovante</button></div>` : '');
  $('#fi-sub').textContent = `CPF ${fmtCpf(r.cpf)} · ${st}`;
  $('#fi-aprovar').hidden = r.status!=='pendente';
  $('#fi-cancelar').hidden = r.status==='cancelado';
}
function abrirFicha(id){
  const r = linhas.find(x=>x.id===id); if(!r) return;
  fichaId = id; marcarVista(id);
  $('#fi-nome').textContent = r.nome;
  $('#fi-n').value = r.nome; $('#fi-cpf').value = r.cpf ? fmtCpf(r.cpf) : ''; $('#fi-t').value = r.telefone; $('#fi-e').value = r.email; $('#fi-c').value = r.cidade; $('#fi-o').value = r.obs||'';
  $('#fi-p').innerHTML = [...new Set([...PERFIS, r.perfil])].map(p=>`<option${p===r.perfil?' selected':''}>${esc(p)}</option>`).join('');
  $('#fi-v').value = r.nivel;
  $('#fi-msg').textContent=''; $('#fi-msg').className='msg';
  preencherInfo(r); render();
  $('#d-ficha').showModal();
}
async function salvarFicha(extra={}){
  const m=$('#fi-msg'); m.className='msg'; m.textContent='';
  const cpfDig = soDigitos($('#fi-cpf').value);
  const dados = { nome:$('#fi-n').value.trim(), cpf: cpfDig || null, telefone:$('#fi-t').value.trim(), email:$('#fi-e').value.trim().toLowerCase(), cidade:$('#fi-c').value.trim(),
    perfil:$('#fi-p').value, nivel:$('#fi-v').value, obs:$('#fi-o').value.trim()||null, ...extra };
  if (dados.nome.split(/\s+/).length<2) { m.textContent='Informe nome e sobrenome.'; return false; }
  if (cpfDig && !cpfOk(cpfDig)) { m.textContent='CPF inválido.'; return false; }
  if (soDigitos(dados.telefone).length<10) { m.textContent='WhatsApp com DDD.'; return false; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(dados.email)) { m.textContent='E-mail inválido.'; return false; }
  if (dados.cidade.length<2) { m.textContent='Informe a cidade.'; return false; }
  const { error } = await db.from('varal_inscricoes').update(dados).eq('id', fichaId);
  if (error) { m.textContent = error.code==='23505' ? 'Já existe outra inscrição ativa com este e-mail.' : 'Não foi possível salvar: '+error.message; return false; }
  await carregar(); return true;
}
$('#fi-salvar').addEventListener('click', async ()=>{ if (await salvarFicha()) { $('#fi-msg').className='msg ok'; $('#fi-msg').textContent='Dados corrigidos ✓'; toast('Dados corrigidos ✓'); } });
$('#fi-aprovar').addEventListener('click', async ()=>{ if (await salvarFicha(ACOES.confirmar())) { toast('Inscrição aprovada ✓ A tela da aluna muda para "vaga garantida".'); $('#d-ficha').close(); } });
$('#fi-cancelar').addEventListener('click', async ()=>{ if (await salvarFicha(ACOES.cancelar())) { toast('Inscrição cancelada'); $('#d-ficha').close(); } });
$('#fi-fechar').addEventListener('click', ()=>$('#d-ficha').close());
$('#d-ficha').addEventListener('close', ()=>{ fichaId=null; render(); });
$('#fi-info').addEventListener('click', async e=>{
  const c=e.target.closest('[data-comp-ficha]'); if(!c) return;
  const janela = window.open('', '_blank');
  const { data, error } = await db.storage.from('varal-comprovantes').createSignedUrl(c.dataset.compFicha, 300);
  if(error || !data?.signedUrl){ if(janela) janela.close(); toast('Não foi possível abrir o comprovante.'); return; }
  if(janela) janela.location = data.signedUrl; else location.href = data.signedUrl;
});
$('#an-ver').addEventListener('click', ()=>{ const r = linhas.find(ehNova); if (r) abrirFicha(r.id); });
$('#ap-ver').addEventListener('click', ()=>{ $('#f-status').value='pendente'; render(); $('#lista').scrollIntoView({behavior:'smooth'}); bip(); });
$('#btn-excel').addEventListener('click', ()=>{
  const rows = filtradas();
  if(!rows.length){ toast('Nada para exportar com esse filtro.'); return; }
  const dados = rows.map(r=>({ Data:dataBR(r.created_at), Nome:r.nome, WhatsApp:r.telefone, 'E-mail':r.email, Cidade:r.cidade, Perfil:r.perfil,
    'Já conta histórias?':r.nivel, Observação:r.obs||'', Lote:r.lote, Valor:Number(r.valor||0), Status:r.status, Teste:r.teste?'sim':'',
    'CPF':fmtCpf(r.cpf), 'Avisou que pagou':dataBR(r.pagamento_informado_em), 'Comprovante':r.comprovante?'sim':'', 'Pagamento confirmado':dataBR(r.pagamento_confirmado_em), 'Link enviado':dataBR(r.link_enviado_em), 'Certificado emitido':dataBR(r.certificado_emitido_em) }));
  const ws = XLSX.utils.json_to_sheet(dados); ws['!cols'] = Object.keys(dados[0]).map(k=>({ wch: Math.max(12, k.length+2) }));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Inscrições');
  XLSX.writeFile(wb, `pronta-pra-contar-inscricoes-${new Date().toLocaleDateString('sv-SE')}.xlsx`);
});

iniciar();
}
</script>
</body>
</html>
